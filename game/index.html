<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101317">
  <title>SOLMAR</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101317; }
    body {
      background: radial-gradient(circle at 50% 28%, #283036 0%, #111519 58%, #090b0d 100%);
      font-family: Georgia, "Times New Roman", serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="SOLMAR, an open-world getaway driver game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
